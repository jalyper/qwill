[package]
name = "qwill"
version = "2.0.0"
description = "Qwill: a desktop word processor that edits .docx files on real pages"
authors = ["Keaton Anderson"]
license = "MIT"
repository = "https://github.com/jalyper/qwill"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# PDF text extraction
pdf-extract = "0.8"
# DOCX generation
docx-rs = "0.4"
tauri-plugin-single-instance = "2"
